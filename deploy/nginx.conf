# ============================================================
# 地下水智能建模系统 — Nginx HTTPS 反向代理配置
# 部署路径: /etc/nginx/sites-available/groundwater-llm
# 启用: ln -s /etc/nginx/sites-available/groundwater-llm /etc/nginx/sites-enabled/
# ============================================================

# HTTP → HTTPS 重定向
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;

    # 用于 Certbot 验证
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主服务
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-domain.com;

    # SSL 证书（运行 certbot --nginx 后自动填充）
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 上传文件大小限制（SHP、GeoTIFF 等）
    client_max_body_size 200m;

    # HTTP Basic Auth（可选但推荐 — 取消注释以启用密码保护）
    # auth_basic "Groundwater Modeling System";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    # 代理到 Gradio
    location / {
        proxy_pass http://127.0.0.1:7860;
        proxy_http_version 1.1;

        # WebSocket 支持（Gradio 实时通信需要）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 头信息转发
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置（MODFLOW 模拟可能耗时数分钟）
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # 缓冲 Gradio 流式响应
        proxy_buffering off;
    }
}
